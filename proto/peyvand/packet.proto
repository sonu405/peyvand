syntax = "proto3";
package peyvand;

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;  // proto3 requires a zero value
  MESSAGE_TYPE_PING = 1;
  MESSAGE_TYPE_PONG = 2;
  MESSAGE_TYPE_SYN = 3;
  MESSAGE_TYPE_SYN_ACK = 4;
  MESSAGE_TYPE_RESET = 5;
  MESSAGE_TYPE_LEAVE = 6;
  MESSAGE_TYPE_HEARTBEAT = 7;
  MESSAGE_TYPE_PEX_REQUEST = 8;
  MESSAGE_TYPE_PEX_RESPONSE = 9;
}

message Packet {
  uint64 id = 1;
  bytes sender_id = 2;
  uint32 session_id = 3;   // sender's session id, changes on every handshake
  MessageType type = 4;
  bytes payload = 5;
}

// nonce -- number used once to identify the pings and its returned pong.
message Ping { uint64 nonce = 1; }  
message Pong { uint64 nonce = 1; }
message Syn {}
message SynAck{}
message Reset{}
message Leave{}

message Heartbeat{}
message PeerRecord {
  bytes peer_id = 1;
  uint32 ipv4 = 2;
  uint32 port = 3;
}

message PexRequest {}
message PexResponse {repeated PeerRecord peers = 1; }