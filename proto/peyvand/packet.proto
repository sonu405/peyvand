syntax = "proto3";
package peyvand;

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;  // proto3 requires a zero value
  MESSAGE_TYPE_PING = 1;
  MESSAGE_TYPE_PONG = 2;
  MESSAGE_TYPE_SYN = 3;
  MESSAGE_TYPE_SYN_ACK = 4;
  MESSAGE_TYPE_RESET = 5;
  MESSAGE_TYPE_LEAVE = 6;
  MESSAGE_TYPE_HEARTBEAT = 7;
  MESSAGE_TYPE_PEX_REQUEST = 8;
  MESSAGE_TYPE_PEX_RESPONSE = 9;
  MESSAGE_TYPE_DATA = 10;  // reliable transport: data packet  (Stage 2)
  MESSAGE_TYPE_ACK = 11;   // reliable transport: ACK (transport ACK, SYN_ACK se alag)
  MESSAGE_TYPE_RESUME = 12; // reliable transport: reconnect par "main yahan tak deliver kar chuka" (Stage 2 persistence)
}

message Packet {
  uint64 id = 1;
  bytes sender_id = 2;
  MessageType type = 3;
  bytes payload = 4;
}

// nonce -- number used once to identify the pings and its returned pong.
message Ping { uint64 nonce = 1; }  
message Pong { uint64 nonce = 1; }
message Syn {}
message SynAck{}
message Reset{}
message Leave{}

message Heartbeat{}
message PeerRecord {
  bytes peer_id = 1;
  uint32 ipv4 = 2;
  uint32 port = 3;
}

message PexRequest {}
message PexResponse {repeated PeerRecord peers = 1; }

// Reliable transport (Stage 2 -- Selective Repeat + persistence)
//
// seq    = live window sequence (mod SEQUENCE_SPACE) -- sirf is session ki sliding-window ARQ ke liye.
// offset = ABSOLUTE monotonic message number (per peer, kabhi wrap nahi) -- yahi disk pe persist hota,
//          yahi "resume from exact sequence" aur cross-session duplicate-drop ko mumkin banata.
message Data { uint32 seq = 1; bytes payload = 2; uint64 offset = 3; }

// delivered_offset = receiver ne is peer se ab tak jitne absolute offset tak IN-ORDER deliver kiye.
// Sender isse apna durable outbox prune karta hai (jo deliver ho gaya use disk se hata do).
message Ack  { uint32 seq = 1; uint64 delivered_offset = 2; }

// RESUME: reconnect par receiver sender ko batata hai "main tumse offset X tak deliver kar chuka,
// ab X+1 se bhejo" -- taake delivery 0 se nahi, EXACT agle offset se resume ho.
message Resume { uint64 delivered_offset = 1; }